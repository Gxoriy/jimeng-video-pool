# aigen-panel Nginx 反代配置（可选）
# 用途：将域名 https://your-domain.com 反代到本地后端 (默认 127.0.0.1:8000)
# 后端本身已开启 CORS 并直接托管前端 SPA，因此只需反代 /api 和 / 静态资源即可。
#
# 部署方式：
#   cp nginx-aigen-panel.conf /etc/nginx/sites-available/aigen-panel
#   ln -s /etc/nginx/sites-available/aigen-panel /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名或服务器 IP

    # 上传/下载媒体可能较大，放宽 body 限制到 50MB
    client_max_body_size 50m;

    # 静态资源（SPA）由后端托管，这里直接反代全部
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
