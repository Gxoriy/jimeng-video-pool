name: Build Desktop Apps (Windows + macOS arm64)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      # .env 是 gitignore 的，CI 上不存在；extraResources 需要它，这里用 secret 或占位生成
      - name: Ensure backend/.env exists
        shell: bash
        run: |
          if [ -z "${{ secrets.BACKEND_ENV }}" ]; then
            printf 'DATABASE_URL=postgres://postgres:CHANGE_ME@127.0.0.1:5432/jimen2api-all\nPORT=8000\nNODE_ENV=production\n' > backend/.env
          else
            echo "${{ secrets.BACKEND_ENV }}" > backend/.env
          fi

      # 把 Node 运行时打进包里，同事无需预装 Node
      - name: Bundle Node runtime (win-x64)
        shell: pwsh
        run: |
          $ver = "20.18.1"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip" -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node_extract
          Copy-Item "node_extract/node-v$ver-win-x64/node.exe" "backend/node_modules/node.exe"
          Remove-Item node.zip, node_extract -Recurse -Force

      - name: Build Electron (Windows)
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 未配置证书时不尝试签名，避免 CI 上签名崩溃
        run: npm run electron:build -- --config.directories.output=release --win --publish never

      - name: List artifacts
        shell: bash
        run: ls -la frontend/release/ || true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: frontend/release/*Setup*.exe

  build-macos:
    name: Build macOS arm64 (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Build backend
        working-directory: backend
        run: npm run build

      # .env 是 gitignore 的，CI 上不存在；extraResources 需要它，这里用 secret 或占位生成
      - name: Ensure backend/.env exists
        run: |
          if [ -z "${{ secrets.BACKEND_ENV }}" ]; then
            printf 'DATABASE_URL=postgres://postgres:CHANGE_ME@127.0.0.1:5432/jimen2api-all\nPORT=8000\nNODE_ENV=production\n' > backend/.env
          else
            echo "${{ secrets.BACKEND_ENV }}" > backend/.env
          fi

      # 把 Node 运行时打进包里（darwin-arm64），同事无需预装 Node
      - name: Bundle Node runtime (darwin-arm64)
        run: |
          VER=20.18.1
          curl -fsSL "https://nodejs.org/dist/v${VER}/node-v${VER}-darwin-arm64.tar.gz" -o node.tar.gz
          tar -xzf node.tar.gz
          cp "node-v${VER}-darwin-arm64/bin/node" backend/node_modules/node
          rm -rf "node-v${VER}-darwin-arm64" node.tar.gz

      # 默认产出未签名包（package.json 中 mac.identity=null 已关闭签名）。
      # 若日后配置了 Apple 证书 Secrets，取消 package.json 的 identity:null，
      # 下面会把签名/公证环境变量注入，触发自动签名 + 公证。
      - name: Export signing env (only if Apple cert secrets present)
        if: ${{ secrets.MAC_CSC_LINK != '' }}
        run: |
          echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      - name: Build Electron (macOS arm64)
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 未配置证书时不尝试自动发现签名身份，配合 identity:null 避免“empty password / frontend not a file”崩溃
        run: npm run electron:build -- --config.directories.output=release --mac --publish never

      - name: List artifacts
        run: ls -la frontend/release/ || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: frontend/release/*.dmg

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-installer/*Setup*.exe
            artifacts/macos-installer/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
